<html>
    <head>
        <title>Clicker Game</title> 
    </head>
    <body style="background-color: rgb(104, 22, 167); font-family: Arial, sans-serif;">
        <h1 style="color: blue; text-align: center;">Click the Button!</h1>

        <div style="display: grid; place-items: center; height: 70vh;">
          <!-- Added padding, font-size, and cursor style below -->
          <button onclick="s.textContent = ++c" style="padding: 20px 40px; font-size: 30px; cursor: pointer;">Click Me!</button>
          <p id="s" style="font-size: 24px;">0</p>
        </div>
        <script>let c = 0</script>
        <var button onclick="alert"></var>
    </body>
</html>
